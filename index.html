<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Site Tracker</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f2f4f1;color:#203128;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:white;border:1px solid #dce2dc;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:28px}h2{font-size:20px}button,input,select{font:inherit;padding:10px;border:1px solid #bac8bf;border-radius:8px}button{background:#245a40;color:white;cursor:pointer}button:disabled{opacity:.5}input{max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.worker{padding:12px 0;border-bottom:1px solid #eee}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:center;border-bottom:1px solid #ddd}td:first-child,th:first-child{text-align:left}small{color:#59665d}#status{white-space:pre-wrap} [hidden]{display:none!important}
</style><main><h1>Job Site Tracker</h1><p id="status" role="status"></p><section id="login"><h2>Private sign in</h2><form id="auth"><p><input id="email" type="email" placeholder="Email" required></p><p><input id="password" type="password" placeholder="Password" required></p><button>Sign in</button></form></section><div id="app" hidden><div class="row"><span id="account"></span><button id="logout">Sign out</button></div><section><h2>Daily attendance</h2><div class="row"><button id="prev">←</button><input id="day" type="date"><button id="next">→</button><button id="today">Today</button></div><p><small>Not recorded is different from absent. Changes save immediately.</small></p><div id="daily"></div></section><section><h2>Weekly billing</h2><div id="week"></div><div class="scroll"><table id="report"></table></div><p id="total"></p><button id="export">Export CSV</button></section><section><h2>Manage workers</h2><form id="add"><input id="name" placeholder="Worker name" required><button>Add</button></form><p><button id="seed">Add original seven workers</button></p><div id="manage"></div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://rntthgumonizexkyikqj.supabase.co', KEY='sb_publishable_RP3CLjpVHxhf2ulxsqVYug_0aOETo-p';
const $=id=>document.getElementById(id), status=s=> $('status').textContent=s;
const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, shift=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return date(d)};
$('day').value=date(new Date());
if(!URL.startsWith('https://')){status('Setup required: edit the Supabase URL and publishable key in index.html.');throw Error('Not configured')}
const db=createClient(URL,KEY);let workers=[],records=[],days=[],busy=false,session=null;
const check=r=>{if(r.error)throw r.error;return r.data};
function el(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=true);try{await fn();status('')}catch(e){status('Error: '+e.message+' — changes may not have saved. Reload to verify.')}finally{busy=false;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=false)}}
async function load(){let d=$('day').value;if(!d)return;let dow=new Date(d+'T12:00:00').getDay();let mon=shift(d,-((dow+6)%7));days=Array.from({length:6},(_,i)=>shift(mon,i));workers=check(await db.from('workers').select('*').order('name'));records=check(await db.from('attendance').select('*').gte('day',mon).lte('day',shift(mon,6)));render()}
const val=(id,d)=>records.find(r=>r.worker_id===id&&r.day===d)?.amount;
function render(){let d=$('day').value; $('daily').replaceChildren();$('manage').replaceChildren();$('seed').hidden=workers.length>0;for(let w of workers){if(new Date(d+'T12:00:00').getDay()!==0&&(w.active||val(w.id,d)!=null)){let row=el('div','',$('daily'));row.className='row worker';el('span',w.name,row);let sel=el('select','',row);sel.setAttribute('aria-label',w.name+' attendance');for(let [v,t] of [['','Not recorded'],['0','Absent'],['0.5','Half day'],['1','Full day']]){let o=el('option',t,sel);o.value=v}sel.value=val(w.id,d)??'';sel.onchange=()=>run(async()=>{let v=sel.value;if(v==='')check(await db.from('attendance').delete().eq('worker_id',w.id).eq('day',d));else check(await db.from('attendance').upsert({worker_id:w.id,day:d,amount:Number(v)}));await load()})}let row=el('div','',$('manage'));row.className='row worker';el('span',w.name+(w.active?'':' (inactive)'),row);el('button',w.active?'Deactivate':'Reactivate',row).onclick=()=>run(async()=>{check(await db.from('workers').update({active:!w.active}).eq('id',w.id));await load()})}if(new Date(d+'T12:00:00').getDay()===0)el('p','Sunday is outside the billing week.',$('daily'));$('week').textContent=days[0]+' – '+days[5];let t=$('report');t.replaceChildren();let h=el('tr','',t);['Worker','Mon','Tue','Wed','Thu','Fri','Sat','Total'].forEach(x=>el('th',x,h));let total=0,missing=0;for(let w of reportWorkers()){let r=el('tr','',t);el('td',w.name,r);let sum=0;for(let day of days){let v=val(w.id,day);el('td',v??'—',r);sum+=Number(v??0);if(v==null&&day<=date(new Date())&&w.active)missing++}el('td',sum,r);total+=sum}$('total').textContent=`Total: ${total} worker-days · ${missing} unrecorded active-worker entries through today`}
function reportWorkers(){return workers.filter(w=>w.active||days.some(d=>val(w.id,d)!=null))}
$('auth').onsubmit=e=>{e.preventDefault();run(async()=>{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await init()})};$('logout').onclick=()=>run(async()=>{check(await db.auth.signOut());workers=[];records=[];$('daily').replaceChildren();$('report').replaceChildren();$('manage').replaceChildren();await init()});async function init(){session=check(await db.auth.getSession()).session;$('app').hidden=!session;$('login').hidden=!!session;if(session){$('account').textContent=session.user.email;await load()}}
$('day').onchange=()=>run(load);for(let [id,n] of [['prev',-1],['next',1]])$(id).onclick=()=>run(async()=>{$('day').value=shift($('day').value,n);await load()});$('today').onclick=()=>run(async()=>{$('day').value=date(new Date());await load()});$('add').onsubmit=e=>{e.preventDefault();run(async()=>{let name=$('name').value.trim();if(!name)return;check(await db.from('workers').insert({name}));$('name').value='';await load()})};$('seed').onclick=()=>run(async()=>{if(workers.length)return;check(await db.from('workers').insert(['Oscar','Mario','Ernesto','Ricardo','Jose (Wolverine)','Ivan','Isais'].map(name=>({name}))));await load()});$('export').onclick=()=>{let csv=[['Worker',...days,'Total'],...reportWorkers().map(w=>[w.name,...days.map(d=>val(w.id,d)??''),days.reduce((s,d)=>s+Number(val(w.id,d)??0),0)])].map(r=>r.map(x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='attendance-'+days[0]+'.csv';a.click();setTimeout(()=>window.URL.revokeObjectURL(a.href),1000)};run(init);
</script></html>
